<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ABC Colleges - Library Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
   
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 12px;
      background-color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 3em;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.5em;
    }

    
    .card-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 0 20px 40px; 
    }

    
    .card {
      border: 3px solid #000; 
      border-radius: 5px;
      background-color: #f9f9f9;
      padding: 10px;
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
    }

    .card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
      margin-left: 10px;
      margin-right: 0;
    }

    .card-details {
      display: flex;
      flex-direction: column;
    }

    .card-details p {
      margin: 3px 0;
      line-height: 1.3;
    }

    
    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      h2 {
        font-size: 1.2em;
      }
     
      .card {
        flex-direction: column-reverse;
        align-items: flex-start;
      }
      .card img {
        margin-left: 0;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>ABC Colleges</h1>
  <h2>Library users</h2>

  <div class="card-container" id="cardContainer">
  
  </div>

  <script>
    function loadXML() {
      let xhr = new XMLHttpRequest();
      xhr.open("GET", "rochemae_bagolboc.xml", true); 
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          let xmlDoc = xhr.responseXML;
          let students = xmlDoc.getElementsByTagName("student");

          let container = document.getElementById("cardContainer");

          for (let i = 0; i < students.length; i++) {
            let picture = students[i].getElementsByTagName("picture")[0].textContent;
            let name = students[i].getElementsByTagName("name")[0].textContent;
            let course = students[i].getElementsByTagName("course")[0].textContent;
            let yearSection = students[i].getElementsByTagName("year_section")[0].textContent;
            let adviser = students[i].getElementsByTagName("adviser")[0].textContent;
            let schoolYear = students[i].getElementsByTagName("school_year")[0].textContent;

           
            let card = document.createElement("div");
            card.classList.add("card");

           
            let img = document.createElement("img");
            img.src = picture;
            img.alt = "Student Picture";

         
            let details = document.createElement("div");
            details.classList.add("card-details");

         
            let pName = document.createElement("p");
            pName.textContent = "Name: " + name;

            let pCourse = document.createElement("p");
            pCourse.textContent = "Course: " + course;

           
            let pYearSection = document.createElement("p");
            pYearSection.textContent = "Year Level / Section: " + yearSection;

       
            let pAdviser = document.createElement("p");
            pAdviser.textContent = "Adviser: " + adviser;

      
            let pSchoolYear = document.createElement("p");
            pSchoolYear.textContent = "School Year: " + schoolYear;

         
            details.appendChild(pName);
            details.appendChild(pCourse);
            details.appendChild(pYearSection);
            details.appendChild(pAdviser);
            details.appendChild(pSchoolYear);

        
            card.appendChild(img);
            card.appendChild(details);

            
            container.appendChild(card);
          }
        }
      };
      xhr.send();
    }

    
    window.onload = loadXML;
  </script>
</body>
</html>
